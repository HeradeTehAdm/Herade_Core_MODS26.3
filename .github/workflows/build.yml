name: Build Herade Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: gradle selfTest build --no-daemon

      - name: Verify runtime JAR contents
        shell: bash
        run: |
          MOD_JAR="$(find build/libs -maxdepth 1 -type f -name 'herade-core-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$MOD_JAR"
          jar tf "$MOD_JAR" | grep -qx 'fabric.mod.json'
          jar tf "$MOD_JAR" | grep -qx 'herade_core.mixins.json'
          jar tf "$MOD_JAR" | grep -qx 'studio/herade/core/HeradeCore.class'
          jar tf "$MOD_JAR" | grep -qx 'studio/herade/core/commands/MinecraftLinkCommand.class'

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: herade-core
          path: |
            build/libs/herade-core-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with installable JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Herade Core 0.1.0
          target_commitish: ${{ github.sha }}
          files: build/libs/herade-core-0.1.0.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
